name: desktop-sender-release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag to build (for example v1.2.8)"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: desktop-sender-release-${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build-and-release:
    name: Build Windows sender EXE and publish release asset
    runs-on: windows-2022
    env:
      RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Verify release tag and package version
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag: $env:RELEASE_TAG"
          }
          $version = $env:RELEASE_TAG.Substring(1)
          $package = Get-Content apps/sender/package.json -Raw | ConvertFrom-Json
          if ($package.version -ne $version -or $package.manifest.version -ne $version) {
            throw "Tag version $version does not match sender package/manifest"
          }
          "VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            apps/sender/package-lock.json
            apps/web/package-lock.json
            apps/desktop/package-lock.json

      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          targets: wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --locked --version 0.15.0

      - name: Build sender WASM variants
        working-directory: apps/sender
        run: npm ci --ignore-scripts; npm run wasm

      - name: Install web dependencies
        working-directory: apps/web
        run: npm ci

      - name: Install desktop dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Build portable Windows sender EXE
        working-directory: apps/desktop
        run: npm run build

      - name: Upload EXE to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $asset = "apps/desktop/dist/AirFerry-Sender-${env:VERSION}-win-x64.exe"
          if (-not (Test-Path $asset)) { throw "Desktop sender EXE not found: $asset" }
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG $asset --clobber
          } else {
            gh release create $env:RELEASE_TAG $asset --title $env:RELEASE_TAG --generate-notes
          }
