name: publish-artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag to create or update"
        required: true
        type: string
      source_run:
        description: "Successful release-all workflow run ID containing the assets"
        required: true
        type: string

permissions:
  contents: write
  actions: read

jobs:
  publish:
    name: Publish existing release artifacts
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      SOURCE_RUN: ${{ inputs.source_run }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: ${{ inputs.release_tag }}
      - name: Download assets from successful build run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir release
          artifact_ids="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN/artifacts" --jq '.artifacts[] | select(.expired == false) | .id')"
          test -n "$artifact_ids"
          while read -r artifact_id; do
            archive="/tmp/airferry-artifact-$artifact_id.zip"
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$archive"
            unzip -q "$archive" -d release
            rm -f "$archive"
          done <<< "$artifact_ids"
          test -n "$(find release -maxdepth 1 -type f -print -quit)"
      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" release/* --clobber
          else
            gh release create "$RELEASE_TAG" release/* --title "$RELEASE_TAG" --generate-notes
          fi
